{% extends "base.html" %}
{% block title %}Ориентир: смена пароля{% endblock %}
{% block content %}
<section class="card" style="max-width:420px;margin:24px auto 0;width:100%">
<h1 style="font-size:26px">Смена пароля</h1>
{% if err %}<div class="errors" role="alert">{{ err }}</div>{% endif %}
{% if msg %}<div class="note" role="status">{{ msg }}</div>{% endif %}
<form method="post" style="display:flex;flex-direction:column;gap:14px">
<div class="field"><label for="current">Текущий пароль</label><input id="current" name="current" type="password" autocomplete="current-password" required></div>
<div class="field"><label for="new">Новый пароль (не короче 8 символов)</label><input id="new" name="new" type="password" autocomplete="new-password" required minlength="8"></div>
<div class="field"><label for="repeat">Повторите новый пароль</label><input id="repeat" name="repeat" type="password" autocomplete="new-password" required minlength="8"></div>
<div class="row"><button class="primary" type="submit">Сохранить</button><a class="secondary" href="/">Назад</a></div>
</form>
</section>
{% endblock %}
